name: aop-web build
on:
  push:
    branches:
      - "*"
  workflow_dispatch:
    inputs:
      force-image-build:
        description: "Force an image build/deployment to DEV outside of a merge to main"
        required: false
        default: false
        type: boolean
env:
  NAMESPACE: a3c641-tools
  ARTIFACT_BUILD_NAME: aop-web-artifact-build
  ARTIFACT_IMAGE_NAME: aop-web-artifacts
  BUILD_NAME: aop-web-image-build
  IMAGE_NAME: aop-web
  SOURCE_IMAGE_TAG: latest
  TARGET_IMAGE_TAG: dev
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./aop
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-node@main
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: E2E tests
        run: npm run test:e2e:headless
      # - name: LINTing
      #   run: npm run lint
      # - name: OpenAPI Schema
      #   run: npm run test:schema
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./aop
    needs: [test]
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.OS }}-build-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-build-${{ env.cache-name }}-
            ${{ runner.OS }}-build-
            ${{ runner.OS }}-
      - name: npm install and build
        run: |
          npm i
          npm run build --if-present
        env:
          CI: "true"
  image-build:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event.inputs.force-image-build == 'true'}}
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - uses: redhat-actions/openshift-tools-installer@v1
        with:
          source: "mirror"
          oc: "latest"
      - name: Log in to Openshift
        run: oc login --token=${{ secrets.OpenShiftToken }} --server=${{ secrets.OpenShiftServerURL}}
      - name: Generate Artifact Build
        run: oc start-build ${ARTIFACT_BUILD_NAME} -n ${NAMESPACE} --follow
      - name: Tag Artifact Build
        run: oc tag -n ${NAMESPACE} ${NAMESPACE}/${ARTIFACT_IMAGE_NAME}:${SOURCE_IMAGE_TAG} ${NAMESPACE}/${ARTIFACT_IMAGE_NAME}:${TARGET_IMAGE_TAG}
      - name: Generate Image Build
        run: oc start-build ${BUILD_NAME} -n ${NAMESPACE} --follow
      - name: Time delay
        # to give time for Openshift to process the build so it doesn't tag the wrong image
        run: sleep 30s
      - name: Tag Image Build
        run: oc tag -n ${NAMESPACE} ${NAMESPACE}/${IMAGE_NAME}:${SOURCE_IMAGE_TAG} ${NAMESPACE}/${IMAGE_NAME}:${TARGET_IMAGE_TAG}
